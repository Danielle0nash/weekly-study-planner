<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Study Planner</title>
<style>
body{font-family:Arial;background:#eff6ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input,select{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{padding:11px 16px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.task{padding:12px;background:#dbeafe;margin:9px 0;border-radius:8px;display:flex;gap:10px;align-items:center}
.task span{flex:1}
.done{text-decoration:line-through;color:#64748b}
</style>
</head>
<body>
<main>
<h1>Weekly Study Planner</h1>
<input id="subject" placeholder="Enter study task">
<select id="day">
<option>Monday</option><option>Tuesday</option>
<option>Wednesday</option><option>Thursday</option>
<option>Friday</option><option>Saturday</option>
<option>Sunday</option>
</select>
<button onclick="addTask()">Add Task</button>
<h2>My Weekly Tasks</h2>
<div id="tasks"></div>
</main>
<script>
let tasks=JSON.parse(localStorage.getItem("studyTasks")||"[]");
function save(){
 localStorage.setItem("studyTasks",JSON.stringify(tasks));
 render();
}
function addTask(){
 const field=document.getElementById("subject");
 const subject=field.value.trim();
 if(!subject)return;
 tasks.push({subject,day:document.getElementById("day").value,done:false});
 field.value="";
 save();
}
function render(){
 const list=document.getElementById("tasks");
 list.innerHTML="";
 const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 days.forEach(day=>{
  const heading=document.createElement("h3");
  heading.textContent=day;
  list.appendChild(heading);
  tasks.forEach((task,i)=>{
   if(task.day!==day)return;
   const row=document.createElement("div");
   row.className="task";
   const check=document.createElement("input");
   check.type="checkbox";
   check.checked=task.done;
   check.style.width="auto";
   check.onchange=()=>{tasks[i].done=check.checked;save();};
   const span=document.createElement("span");
   span.textContent=task.subject;
   if(task.done)span.className="done";
   const del=document.createElement("button");
   del.textContent="Delete";
   del.onclick=()=>{tasks.splice(i,1);save();};
   row.append(check,span,del);
   list.appendChild(row);
  });
 });
}
render();
</script>
</body>
</html>
